# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # NOVO: a checagem virou portao. Se este job falhar, o deploy nem comeca.
  checar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Garantir que o index.html existe
        run: test -f index.html

      - name: Proibir a palavra TODO na pagina
        run: |
          if grep -qi "TODO" index.html; then
            echo "Achei a palavra TODO no index.html"
            exit 1
          fi
          echo "Nenhum TODO encontrado"

  deploy:
    needs: checar          # <-- A LINHA QUE MUDA TUDO
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
